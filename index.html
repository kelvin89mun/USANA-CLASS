.hero-shine{position:absolute;top:0;bottom:0;left:0;width:42%;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.14) 50%,transparent 80%);animation:shine 8s ease-in-out 2s infinite;z-index:1;pointer-events:none}
.hero-in{position:relative;z-index:2}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand-name{font-weight:900;font-size:34px;letter-spacing:.5px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.85),0 0 30px rgba(0,0,0,.5)}
.tagline{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;letter-spacing:.3px;padding:5px 12px;border-radius:14px;background:rgba(6,18,45,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18)}
.lang{display:flex;padding:3px;border-radius:99px;background:rgba(6,18,45,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);flex-shrink:0}
.lang button{padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.88);white-space:nowrap}
.lang button.on{background:#fff;color:var(--navy)}
.search{margin-top:16px;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;height:50px;border-radius:99px;background:#fff;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.search svg{flex-shrink:0}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.search input::placeholder{color:#9aa3b5}
.search .q-x{display:none;width:36px;height:36px;border-radius:99px;background:#eef1f6;color:#5d667a;font-size:15px;font-weight:700}
.search.has .q-x{display:block}

/* ---------- Trust ribbon ---------- */
.trust{margin:14px 14px 0;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--gold-bg);border:1px solid #ecdcb0}
.trust-medal{flex-shrink:0;width:38px;height:38px;border-radius:99px;display:grid;place-items:center;font-size:20px;background:linear-gradient(145deg,#e9cf8c,var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.trust b{display:block;font-size:13.5px;line-height:1.4;color:#5e4610}
.trust small{display:block;margin-top:2px;font-size:10.5px;color:#a08a55}

/* ---------- Needs ---------- */
.needs{padding:24px 14px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-head h2{font-size:20px;font-weight:900;letter-spacing:.2px}
.see-all{flex-shrink:0;font-size:14px;font-weight:700;color:var(--blue);padding:6px 2px}
.need-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.need{background:#fff;border-radius:18px;padding:10px 5px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;box-shadow:0 1px 2px rgba(15,35,80,.06),0 4px 14px rgba(15,35,80,.05);transition:transform .15s,border-color .2s,background-color .2s;animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms + 150ms)}
.need .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;line-height:1;background:var(--tint)}
.need .nl{font-size:14px;font-weight:800;color:var(--ink2);text-align:center;line-height:1.22;min-height:2.44em;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center}
.need:active{transform:scale(.95)}
.need.on{border-color:var(--blue);background:#f1f6ff}
.need.on .nl{color:var(--blue)}

/* ---------- Results ---------- */
.results{padding:28px 14px 0;scroll-margin-top:70px}
.res-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-title{font-size:20px;font-weight:900}
.res-count{font-size:13px;font-weight:700;color:var(--blue);background:#e7efff;padding:3px 10px;border-radius:99px}
.res-clear{margin-left:auto;font-size:13.5px;font-weight:700;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:99px}
.res-desc{margin-top:8px;font-size:14.5px;line-height:1.6;color:var(--ink2)}
.list{display:grid;gap:14px;margin-top:16px}

/* ---------- Product card ---------- */
.card{display:flex;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,35,80,.06),0 8px 22px rgba(15,35,80,.06)}
.c-img{position:relative;width:116px;flex-shrink:0;background:#0d1b33 center/cover no-repeat}
.c-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s}
.c-zoom{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:99px;white-space:nowrap}
.c-body{flex:1;min-width:0;padding:14px 14px 14px 15px;border-left:3px solid var(--ac);display:flex;flex-direction:column;cursor:pointer}
.c-tag{align-self:flex-start;max-width:100%;font-size:12px;font-weight:700;color:var(--ac);background:var(--lt);padding:3px 10px;border-radius:99px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name{font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:800;line-height:1.15;color:var(--ink)}
.c-sub{margin-top:3px;font-size:14.5px;font-weight:700;color:var(--ac)}
.c-pain{margin-top:10px;font-size:15px;font-weight:800;line-height:1.45;color:var(--ink)}
.c-ben{margin-top:7px;display:flex;gap:6px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.c-ben i{font-style:normal;font-weight:900;color:var(--ac)}
.c-price{margin-top:12px;display:flex;align-items:center;gap:8px}
.c-price small{font-size:12px;font-weight:700;color:var(--price);background:#e9f7ef;padding:2px 9px;border-radius:99px}
.c-price b{font-size:21px;font-weight:900;color:var(--price);letter-spacing:-.2px}
.c-act{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-soft,.btn-line{height:46px;border-radius:99px;font-size:14.5px;font-weight:800}
.btn-soft{background:var(--lt);color:var(--ac)}
.btn-line{background:#fff;color:var(--ac);border:2px solid var(--ac)}
.btn-line.added{background:var(--price);border-color:var(--price);color:#fff}

/* ---------- Empty + CTA + footer ---------- */
.empty{background:#fff;border-radius:18px;padding:30px 20px;text-align:center;box-shadow:0 8px 22px rgba(15,35,80,.06)}
.empty .e-ico{font-size:40px}
.empty b{display:block;margin-top:10px;font-size:17px}
.empty p{margin-top:6px;font-size:14.5px;color:var(--ink2);line-height:1.6}
.empty .btn-wa{margin-top:16px}
.cta{margin:26px 14px 0;padding:22px 18px 20px;border-radius:22px;background:var(--navy);color:#fff;text-align:center;position:relative;overflow:hidden}
.cta::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 0%,rgba(196,154,60,.35),transparent 55%);pointer-events:none}
.cta>*{position:relative}
.cta h3{font-size:19px;font-weight:900}
.cta p{margin-top:8px;font-size:14.5px;line-height:1.6;opacity:.9}
.cta .btn-wa{margin-top:16px;width:100%}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:99px;background:var(--wa);color:#fff;font-weight:800;font-size:15.5px;box-shadow:0 6px 18px rgba(31,184,85,.35)}
.btn-wa svg{flex-shrink:0}
footer{padding:22px 20px calc(110px + var(--safe-b));text-align:center;color:var(--muted);font-size:12px;line-height:1.8}

/* ---------- Mini bar ---------- */
.minibar{position:fixed;top:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:50;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 12px 8px 16px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(15,35,80,.1);transform:translateY(-120%);transition:transform .28s ease}
.minibar.show{transform:none}
.mb-label{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-search{flex-shrink:0;width:40px;height:40px;border-radius:99px;background:#eef1f6;display:grid;place-items:center}
.mb-cat{flex-shrink:0;height:40px;padding:0 16px;border-radius:99px;background:var(--navy);color:#fff;font-weight:800;font-size:14px}

/* ---------- Floating buttons ---------- */
.fab{position:fixed;right:max(16px,calc(50% - 264px));z-index:40;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(11,42,99,.3)}
.fab-cart{bottom:calc(18px + var(--safe-b));height:58px;padding:0 20px 0 16px;gap:10px;background:var(--navy);color:#fff;font-weight:800;font-size:15.5px;transform:scale(0);transition:transform .28s cubic-bezier(.2,.9,.3,1.3)}
.fab-cart.show{transform:scale(1)}
.fab-cart .bd{min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:#e5484d;font-size:13.5px;display:grid;place-items:center}
.fab-cart.bump{animation:bump .5s}
.fab-top{bottom:calc(88px + var(--safe-b));width:48px;height:48px;background:#fff;color:var(--navy);opacity:0;pointer-events:none;transition:opacity .25s}
.fab-top.show{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));z-index:95;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:rgba(18,26,44,.94);color:#fff;font-size:14.5px;font-weight:700;padding:12px 18px;border-radius:99px;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Layers (sheets + lightbox) ---------- */
.layer{position:fixed;inset:0;z-index:60;display:none}
.layer.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,16,34,.58);animation:fade .25s both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;height:92vh;height:92dvh;background:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.28);animation:up .34s cubic-bezier(.2,.8,.2,1) both}
.sheet.cart-sheet{height:auto;max-height:88vh;max-height:88dvh}
.handle{flex-shrink:0;width:46px;height:5px;border-radius:99px;background:#d3d9e3;margin:10px auto 6px}
.sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:28px}
.x-btn{position:absolute;top:20px;right:22px;z-index:5;width:46px;height:46px;border-radius:99px;background:rgba(10,18,36,.66);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sh-media{position:relative;height:260px;margin:0 14px;border-radius:18px;overflow:hidden;background:#0d1b33 center/cover no-repeat;cursor:zoom-in}
.sh-media img{width:100%;height:100%;object-fit:contain}
.sh-media span{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:6px 13px;border-radius:99px;white-space:nowrap}
.sh-head{padding:16px 18px 0;display:flex;gap:10px;align-items:flex-start}
.sh-head>div{flex:1;min-width:0}
.sh-name{font-family:'Playfair Display',Georgia,serif;font-size:27px;font-weight:800;line-height:1.12}
.sh-sub{margin-top:5px;font-size:16px;font-weight:700;color:var(--ac)}
.sh-share{flex-shrink:0;height:38px;padding:0 13px;border-radius:99px;background:#eef1f6;font-size:13px;font-weight:700;color:var(--ink2);margin-top:2px}
.sh-tag{display:inline-block;margin:10px 18px 0;font-size:12.5px;font-weight:700;color:var(--ac);background:var(--lt);padding:4px 11px;border-radius:99px}
.sh-pain{margin:12px 18px 0;padding:13px 15px;border-radius:14px;background:var(--lt);border-left:4px solid var(--ac);color:var(--ac);font-weight:800;font-size:16px;line-height:1.5}
.sh-price{margin:12px 18px 0;padding:12px 15px;border-radius:14px;background:#edf8f1;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sh-price span{font-size:13px;font-weight:700;color:#3f7757}
.sh-price b{font-size:27px;font-weight:900;color:var(--price)}
.sh-sec{padding:20px 18px 0}
.sh-sec h4{font-size:16px;font-weight:900;margin-bottom:9px}
.sh-sec p{font-size:15px;line-height:1.7;color:var(--ink2)}
.ben{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px;line-height:1.6;color:var(--ink2)}
.ben i{flex-shrink:0;width:22px;height:22px;margin-top:2px;border-radius:99px;background:var(--ac);color:#fff;font-style:normal;font-size:12px;font-weight:900;display:grid;place-items:center}
.use{display:flex;gap:10px;padding:13px 15px;border-radius:14px;background:#fff7ea;border:1px solid #f1e0bb;color:#664a14;font-size:15px;line-height:1.65}
.src{margin-top:7px;font-size:11.5px;color:#a2a9b6}
.note{margin:18px 18px 0;padding:13px 15px;border-radius:14px;background:#f4f6fa;font-size:14px;line-height:1.65;color:var(--ink2)}
.rel-wrap{padding-top:22px}
.rel-wrap h4{font-size:16px;font-weight:900;padding:0 18px;margin-bottom:10px}
.rel{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 6px;scroll-padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rel::-webkit-scrollbar{display:none}
.rel-item{flex:0 0 172px;scroll-snap-align:start;display:flex;gap:10px;align-items:center;text-align:left;padding:9px;border-radius:14px;border:1px solid var(--line);background:#fff}
.rel-item img{width:44px;height:70px;border-radius:9px;object-fit:cover;background:#0d1b33;flex-shrink:0}
.rel-item b{display:block;font-size:13.5px;line-height:1.3}
.rel-item small{display:block;margin-top:4px;font-size:13px;font-weight:800;color:var(--price)}
.sheet-bar{flex-shrink:0;display:grid;grid-template-columns:1.35fr 1fr;gap:10px;padding:12px 14px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:#fff}
.sheet-bar .btn-wa{width:100%;padding:0 10px}
.btn-add{height:52px;border-radius:99px;background:var(--navy);color:#fff;font-weight:800;font-size:15.5px}
.btn-add.added{background:var(--price)}

/* cart */
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px 20px}
.cart-head h3{font-size:20px;font-weight:900}
.cart-close{width:44px;height:44px;border-radius:99px;background:#eef1f6;font-size:19px;font-weight:700}
.cart-send{padding:0 16px 8px}
.cart-send .btn-wa{width:100%}
.ci{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid #eef1f5}
.ci img{width:46px;height:72px;border-radius:10px;object-fit:cover;background:#0d1b33;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:15px;font-weight:800;line-height:1.3}
.ci-price{margin-top:2px;font-size:13.5px;font-weight:800;color:var(--price)}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:36px;height:36px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--blue);font-size:19px;font-weight:800;line-height:1}
.qty span{min-width:20px;text-align:center;font-weight:900;font-size:15px}
.ci-del{flex-shrink:0;padding:10px 4px;font-size:13px;font-weight:700;color:#a3aab8}
.cart-total{display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px 4px}
.cart-total span{font-size:15px;font-weight:800;color:var(--ink2)}
.cart-total b{font-size:25px;font-weight:900;color:var(--price)}
.c-ss{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-ss span{font-size:12px;font-weight:700;color:#8a6417;background:#fbf1dc;padding:2px 9px;border-radius:99px}
.c-ss b{font-size:15.5px;font-weight:800;color:#8a6417}
.sh-ss{margin:8px 18px 0;padding:11px 15px;border-radius:14px;background:#fbf4e3;border:1px solid #f0e2bf}
.sh-ss div{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sh-ss span{font-size:13.5px;font-weight:800;color:#8a6417}
.sh-ss b{font-size:21px;font-weight:900;color:#8a6417;white-space:nowrap}
.sh-ss p{margin-top:4px;font-size:13px;line-height:1.5;color:#7a6a45}
.cart-ss{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px 20px 2px}
.cart-ss span{font-size:13.5px;font-weight:700;color:#8a6417}
.cart-ss b{font-size:18px;font-weight:900;color:#8a6417;white-space:nowrap}
.cart-note{padding:6px 20px 18px;font-size:12.5px;color:var(--muted)}
.cart-empty{padding:34px 20px 44px;text-align:center}
.cart-empty div{font-size:42px}
.cart-empty b{display:block;margin-top:10px;font-size:17px}
.cart-empty p{margin-top:6px;font-size:14.5px;color:var(--ink2);line-height:1.6}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:#000;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.lb.open{display:block;animation:fade .2s both}
.lb img{width:100%;height:auto;margin:0 auto;max-width:560px}
.lb-x{position:fixed;top:calc(12px + var(--safe-t));right:max(12px,calc(50% - 268px));z-index:2;width:48px;height:48px;border-radius:99px;background:rgba(255,255,255,.22);color:#fff;font-size:22px;font-weight:700;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lb-hint{position:fixed;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);font-size:12.5px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.55);padding:7px 14px;border-radius:99px;pointer-events:none;white-space:nowrap}

/* motion */
@keyframes kb{0%,100%{transform:scale(1.04)}50%{transform:scale(1.12) translate(-1.2%,-.6%)}}
@keyframes shine{0%{transform:translateX(-160%);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(360%);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bump{0%,100%{transform:scale(1)}35%{transform:scale(1.14)}65%{transform:scale(.95)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

      <div class="brand-name">USANA</div>
      <div class="lang" role="group" aria-label="Language">

      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="搜索：膝盖、胀气、容易累">

<div class="trust">

</div>

function layerEl(n){ return n === 'p' ? $('pLayer') : (n === 'c' ? $('cLayer') : $('lb')); }
function showLayer(n){
  var te = $('toast'); if (te) te.classList.remove('show');
  layerEl(n).classList.add('open'); stack.push(n); gen++;
  try { history.pushState({layer: n}, ''); } catch (e) {}
  document.body.style.overflow = 'hidden';
}
function hideLayer(n){
  layerEl(n).classList.remove('open');
  var s = n === 'p' ? $('pSheet') : (n === 'c' ? $('cSheet') : null);
  if (s){ s.style.transform = ''; s.style.transition = ''; }
  if (!stack.length) document.body.style.overflow = '';
}
var gen = 0;
function goBack(){
  if (!stack.length) return;
  var depth = stack.length, g = gen;
  history.back();
  setTimeout(function(){ if (stack.length === depth && gen === g){ var n = stack.pop(); hideLayer(n); } }, 450);
}
window.addEventListener('popstate', function(){ if (stack.length){ var n = stack.pop(); hideLayer(n); } });

/* ---------- Product sheet ---------- */
function related(p){
  var out = [];
  CATS.forEach(function(c){ if (c.ids.indexOf(p.id) >= 0) c.ids.forEach(function(id){ if (id !== p.id && out.indexOf(id) < 0) out.push(id); }); });
  if (!out.length) ['cellsentials', 'biomega', 'probiotic'].forEach(function(id){ if (id !== p.id) out.push(id); });
  return out.slice(0, 5).map(function(id){ return PM[id]; }).filter(Boolean);
}
function fillSheet(p){
  var s = $('pSheet');
  s.style.setProperty('--ac', p.accent || '#1d5fd0');
  s.style.setProperty('--lt', p.light || '#eef3fb');
  var tag = tx(p, 'tag'), pain = tx(p, 'problem'), suit = tx(p, 'suitable'), bens = tx(p, 'benefits') || [], ing = tx(p, 'ingredients'), use = tx(p, 'usage'), note = tx(p, 'note');
  var h = '<div class="sh-media" data-act="zoom" data-id="' + p.id + '"' + (IMGBG[p.id] ? ' style="background-image:url(' + IMGBG[p.id] + ')"' : '') + '><img src="' + IMGS[p.id] + '" alt="' + esc(p.name) + '"><span>' + t('tapZoom') + '</span></div>' +
    '<div class="sh-head"><div><div class="sh-name">' + esc(p.name) + '</div>' + (lang === 'cn' ? '<div class="sh-sub">' + esc(p.nameCn) + '</div>' : '') + '</div>' +
    '<button class="sh-share" data-act="share">' + t('share') + '</button></div>' +
    (tag ? '<span class="sh-tag">' + esc(tag) + '</span>' : '') +
    (pain ? '<div class="sh-pain">' + esc(pain) + '</div>' : '') +
    (p.price ? '<div class="sh-price"><span>' + t('pricePre') + '</span><b>RM ' + p.price + '</b></div>' +
      '<div class="sh-ss"><div><span>🔁 ' + t('ssTag') + '</span><b>' + rm(p.price * 0.9) + '</b></div><p>' + t('ssLong') + '</p></div>' : '') +
    (suit ? '<div class="sh-sec"><h4>' + t('suitable') + '</h4><p>' + esc(suit) + '</p></div>' : '') +
    (bens.length ? '<div class="sh-sec"><h4>' + t('benefits') + '</h4>' + bens.map(function(b){ return '<div class="ben"><i>✓</i><span>' + esc(b) + '</span></div>'; }).join('') + '</div>' : '') +
    (ing ? '<div class="sh-sec"><h4>' + t('ingredients') + '</h4><p>' + esc(ing) + '</p></div>' : '') +
    (use ? '<div class="sh-sec"><h4>' + t('usage') + '</h4><div class="use"><span>💊</span><span>' + esc(use) + '</span></div><div class="src">' + t('src') + '</div></div>' : '') +
    (note ? '<div class="note">✦ ' + esc(note) + '</div>' : '');
  var rel = related(p);
  if (rel.length) h += '<div class="rel-wrap"><h4>' + t('related') + '</h4><div class="rel">' + rel.map(function(r){
    return '<button class="rel-item" data-act="open-rel" data-id="' + r.id + '"><img src="' + IMGS[r.id] + '" alt=""><span><b>' + esc(pname(r)) + '</b>' + (r.price ? '<small>RM ' + r.price + '</small>' : '') + '</span></button>';
  }).join('') + '</div></div>';
  $('pScroll').innerHTML = h;
  var mi = $('pScroll').querySelector('.sh-media img'); if (mi) setHi(mi, p.id);
  updateSheetAdd();
}
function updateSheetAdd(){
  if (!cur) return;
  var c = cart[cur.id], b = $('pAdd');
  b.classList.toggle('added', !!c);
  b.textContent = c ? t('addedBar') + ' (' + c.qty + ')' : t('addBar');
}
function openProduct(id, swap){
  var p = PM[id]; if (!p) return;
  cur = p; fillSheet(p);
  $('pScroll').scrollTop = 0;
  if (!swap) showLayer('p');
}
function closeProductState(){ cur = null; }

/* ---------- Lightbox ---------- */
var HI = {};
function setHi(im, id){
  var u = FULL[id];
  im.setAttribute('data-hi', id);
  if (u && HI[id]) { im.src = u; return; }
  im.src = IMGS[id];
  if (!u) return;
  var pre = new Image();
  pre.onload = function(){ HI[id] = 1; if (im.getAttribute('data-hi') === id) im.src = u; };
  pre.src = u;
}
function zoom(id){
  setHi($('lbImg'), id);
  $('lb').scrollTop = 0;
  showLayer('lb');
}

/* ---------- Cart ---------- */
function saveCart(){ try { localStorage.setItem('usana_cart', JSON.stringify(cart)); } catch (e) {} }
function cartCount(){ var n = 0; Object.keys(cart).forEach(function(k){ n += cart[k].qty; }); return n; }
function cartTotal(){ var s = 0; Object.keys(cart).forEach(function(k){ s += (PM[k].price || 0) * cart[k].qty; }); return s; }
function updateFab(bump){
  var n = cartCount(), f = $('fabCart');
  $('fabCount').textContent = n;
  f.classList.toggle('show', n > 0);
  if (bump){ f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); }
}
function addToCart(id){
  if (!PM[id]) return;
  cart[id] = cart[id] || {qty: 0};
  cart[id].qty = Math.min(cart[id].qty + 1, 99);
  saveCart(); updateFab(true); refreshAdd(id);
  toast(t('toastAdded') + pname(PM[id]));
}
function renderCart(){
  var ids = Object.keys(cart);
  var h = '<div class="cart-head"><h3>' + t('cart') + '</h3><button class="cart-close" data-act="back" aria-label="Close">✕</button></div>';
  if (!ids.length){
    h += '<div class="cart-empty"><div>🛒</div><b>' + t('cartEmpty') + '</b><p>' + t('cartEmptyDesc') + '</p></div>';
  } else {
    h += '<div class="cart-send"><button class="btn-wa" data-act="send">' + WAICON + '<span>' + t('cartSend') + '</span></button></div>';
    h += ids.map(function(id){
      var p = PM[id], q = cart[id].qty;
      return '<div class="ci"><img src="' + IMGS[id] + '" alt=""><div class="ci-info"><div class="ci-name">' + esc(pname(p)) + '</div>' +
        (p.price ? '<div class="ci-price">RM ' + p.price + (q > 1 ? ' × ' + q + ' = RM ' + (p.price * q) : '') + '</div>' : '') +
        '<div class="qty"><button data-act="dec" data-id="' + id + '" aria-label="-">−</button><span>' + q + '</span><button data-act="inc" data-id="' + id + '" aria-label="+">+</button></div></div>' +
        '<button class="ci-del" data-act="del" data-id="' + id + '">' + t('remove') + '</button></div>';
    }).join('');
    var tot = cartTotal();
    if (tot) h += '<div class="cart-total"><span>' + t('total') + '</span><b>RM ' + tot + '</b></div>' +
      '<div class="cart-ss"><span>🔁 ' + t('ssTotal') + '</span><b>' + rm(tot * 0.9) + '</b></div>';
    h += '<div class="cart-note">' + t('cartNote') + '</div>';
  }
  $('cScroll').innerHTML = h;
}
function changeQty(id, d){
  if (!cart[id]) return;
  cart[id].qty += d;
  if (cart[id].qty <= 0) delete cart[id];
  if (cart[id] && cart[id].qty > 99) cart[id].qty = 99;
  saveCart(); updateFab(false); refreshAdd(id); renderCart();
}
function sendCart(){
  var ids = Object.keys(cart); if (!ids.length) return;
  var lines = ids.map(function(id, i){
    var p = PM[id], q = cart[id].qty;
    return (i + 1) + '. ' + pname(p) + ' x' + q + (p.price ? ' (RM ' + (p.price * q) + ')' : '');
  });
  var tot = cartTotal();
  var msg = t('msgCartHead') + '\n\n' + lines.join('\n') + (tot ? '\n\n' + t('total') + ': RM ' + tot : '') + '\n\n' + t('msgCartEnd');
  openWA(msg);
}

/* ---------- Share ---------- */
function shareCur(){
  if (!cur) return;
  var url = location.origin + location.pathname + location.search + '#' + cur.id;
  if (navigator.share){ navigator.share({title: 'USANA ' + cur.name, url: url}).catch(function(){}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ toast(t('copied')); }, function(){ prompt('', url); }); }
  else prompt('', url);
}

/* ---------- Minibar + scroll ---------- */
function updateMinibar(){
  var label = query ? '🔍 ' + query : (cat === 'all' ? t('all') : CM[cat].ico + ' ' + catLabel(CM[cat]));
  var n = currentList().length;
  $('mbLabel').textContent = label + (lang === 'cn' ? '（' + n + ' 款）' : ' (' + n + ' ' + t('unit') + ')');
}
var ticking = false;
function onScroll(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(function(){
    ticking = false;
    var y = window.pageYOffset || document.documentElement.scrollTop;
    var nb = $('needs').getBoundingClientRect().bottom;
    var show = nb < 70;
    $('minibar').classList.toggle('show', show);
    $('minibar').setAttribute('aria-hidden', show ? 'false' : 'true');
    $('fabTop').classList.toggle('show', y > 700);
  });
}
window.addEventListener('scroll', onScroll, {passive: true});
function toResults(){
  var r = $('results');
  var top = r.getBoundingClientRect().top + (window.pageYOffset || 0) - 62;
  window.scrollTo({top: Math.max(0, top), behavior: 'smooth'});
}

/* ---------- Swipe down to close sheets ---------- */
function swipe(sheet, scroller){
  var y0 = 0, dy = 0, on = false;
  sheet.addEventListener('touchstart', function(e){
    var tg = e.target;
    on = !(tg.closest && tg.closest('.sheet-bar')) && ((scroller.scrollTop <= 0) || (tg.closest && tg.closest('.handle')));
    if (tg.closest && tg.closest('.rel')) on = false;
    y0 = e.touches[0].clientY; dy = 0;
  }, {passive: true});
  sheet.addEventListener('touchmove', function(e){
    if (!on) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0 && scroller.scrollTop <= 0){ sheet.style.transition = 'none'; sheet.style.transform = 'translateY(' + dy + 'px)'; }
    else if (dy <= 0){ sheet.style.transform = ''; }
  }, {passive: true});
  sheet.addEventListener('touchend', function(){
    if (!on) return; on = false;
    sheet.style.transition = 'transform .22s ease';
    if (dy > 110){ sheet.style.transform = 'translateY(100%)'; setTimeout(goBack, 180); }
    else sheet.style.transform = '';
  });
}

/* ---------- Events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  switch (act){
    case 'lang': setLang(el.getAttribute('data-l')); break;
    case 'cat':
      query = ''; $('q').value = ''; $('searchBox').classList.remove('has');
      cat = el.getAttribute('data-k'); if (cat !== 'all' && !CM[cat]) cat = 'all'; render(); toResults(); break;
    case 'all':
      query = ''; $('q').value = ''; $('searchBox').classList.remove('has');
      cat = 'all'; render(); break;
    case 'qclear': e.preventDefault(); query = ''; $('q').value = ''; $('searchBox').classList.remove('has'); render(); $('q').focus(); break;
    case 'open': openProduct(id); break;
    case 'open-rel': openProduct(id, true); break;
    case 'zoom': e.stopPropagation(); zoom(id); break;
    case 'add': e.stopPropagation(); addToCart(id); break;
    case 'add-cur': if (cur) addToCart(cur.id); break;
    case 'wa-product': if (cur) openWA(t('msgProduct', {name: lang === 'cn' ? cur.nameCn : cur.name})); break;
    case 'wa-general': openWA(t('msgGeneral')); break;
    case 'wa-search': openWA(query ? t('msgSearch', {q: query}) : t('msgGeneral')); break;
    case 'share': shareCur(); break;
    case 'cart': renderCart(); showLayer('c'); break;
    case 'inc': changeQty(id, 1); break;
    case 'dec': changeQty(id, -1); break;
    case 'del': changeQty(id, -999); break;
    case 'send': sendCart(); break;
    case 'back': goBack(); break;
    case 'top': window.scrollTo({top: 0, behavior: 'smooth'}); break;
    case 'mb-cat': $('needs').scrollIntoView({behavior: 'smooth', block: 'start'}); break;
    case 'mb-search': window.scrollTo({top: 0, behavior: 'smooth'}); setTimeout(function(){ $('q').focus(); }, 450); break;
  }
});
$('q').addEventListener('input', function(){
  query = this.value.trim();
  $('searchBox').classList.toggle('has', !!this.value);
  render();
});
$('q').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ this.blur(); if (query) toResults(); } });
swipe($('pSheet'), $('pScroll'));
swipe($('cSheet'), $('cScroll'));

/* ---------- Init ---------- */
applyLang();
onScroll();
var h0 = (location.hash || '').replace('#', '');
if (h0 && PM[h0]) setTimeout(function(){ openProduct(h0); }, 350);
})();
</script>
